<ui:composition template="/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:f="jakarta.faces.core"
                xmlns:tc="http://myfaces.apache.org/tobago/component"
                xmlns:ui="jakarta.faces.facelets">

  <tc:box label="Outer box">
    <tc:buttons>
      <tc:button label="One"/>
      <tc:button label="Two"/>
      <tc:button label="Three"/>
    </tc:buttons>
    <tc:buttons>
      <tc:button label="One"/>
      <tc:button label="Two"/>
      <tc:button label="Three"/>
    </tc:buttons>
    <tc:buttons>
      <tc:button label="One"/>
      <tc:button label="Two"/>
      <tc:button label="Three"/>
    </tc:buttons>
    <tc:box label="Inner box">
      <tc:segmentLayout medium="5seg 7seg">
        <tc:tree value="#{treeSelectController.sample}"
                 selectable="#{treeSelectController.selectable}"
                 var="node">
          <tc:treeNode>
            <tc:treeIndent/>
            <tc:treeSelect id="select" value="#{node.userObject.selected}">
              <f:ajax render=":::selectedNodesOutput"/>
            </tc:treeSelect>
            <tc:link label="#{node.userObject.name}" action="#{vController.treeClick(node.userObject.name)}">
              <f:ajax render=":::textarea"/>
            </tc:link>
          </tc:treeNode>
        </tc:tree>
        <tc:panel>
          <tc:out id="selectedNodesOutput" label="Selected Nodes" value="#{treeSelectController.selectedNodes}"/>
          <tc:textarea id="textarea" value="#{vController.treeClickedString}" readonly="true"/>
        </tc:panel>
      </tc:segmentLayout>
    </tc:box>
  </tc:box>
</ui:composition>
